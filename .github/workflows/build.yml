name: Build and Release OpenWrt 25.12.4 APK

on:
  push:
    branches: [ "HK001", "main", "master" ] # 兼容并监听您的 HK001 分支推送
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须配置写权限，以便自动创建/更新 Release
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 解决特权冲突
      - name: Fix workspace permissions
        run: |
          chmod -R a+rwx ${{ github.workspace }}

      # 2. 编译插件
      - name: Build Package inside OpenWrt 25.12.4 SDK Container
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /builder openwrt/sdk:x86-64-25.12.4 /bin/bash -c "
            if [ ! -d ./scripts ]; then
              echo 'Initializing OpenWrt SDK environment...'
              ./setup.sh
            fi
            
            mkdir -p package/luci-app-repomirror
            cp -r /workspace/Makefile /workspace/htdocs /workspace/po /workspace/root package/luci-app-repomirror/
            
            ./scripts/feeds update -a
            ./scripts/feeds install -p luci -a
            
            # 在 .config 中强制启用我们的主包和中文语言包
            echo \"CONFIG_PACKAGE_luci-app-repomirror=y\" >> .config
            echo \"CONFIG_PACKAGE_luci-i18n-repomirror-zh-cn=y\" >> .config
            
            make defconfig
            make package/luci-app-repomirror/compile V=s
            
            # 将生成的 APK 文件复制到挂载的输出目录
            mkdir -p /workspace/output
            find bin/ -name 'luci-app-repomirror*.apk' -exec cp {} /workspace/output/ \;
            find bin/ -name 'luci-i18n-repomirror*.apk' -exec cp {} /workspace/output/ \;
          "

      # 3. 将编译好的 APK 自动上传至 Actions 运行页面的 Artifacts 区域（普通 push、手动运行可用）
      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-repomirror-apk
          path: |
            output/luci-app-repomirror*.apk
            output/luci-i18n-repomirror*.apk

      # 4. 【无感自动滚动发布】每次编译成功，都会在主页自动创建或覆盖更新一个名为 "latest" 的 Release 区域
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/luci-app-repomirror*.apk
            output/luci-i18n-repomirror*.apk
          tag_name: latest
          name: Latest Build (自动滚动发布)
          body: |
            ### 自动编译发布的 OpenWrt 25.12.4 APK 插件
            * 编译架构：x86-64 SDK（输出为 all 通用架构，支持在所有 CPU 上安装）
            * 编译分支：`${{ github.ref_name }}`
            * 基础主包：`luci-app-repomirror`
            * 语言包：`luci-i18n-repomirror-zh-cn`
          draft: false
          prerelease: true # 标记为 Pre-release 滚动更新
